<!-- Footer Shell -->
<script>
        // Simple auto-advance for OTP inputs
        const inputs = document.querySelectorAll('input[type="text"]');
        const verifyBtn = document.querySelector('button.bg-surface-variant');

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
                
                // Check if all filled to enable button
                const allFilled = Array.from(inputs).every(i => i.value.length === 1);
                if (allFilled) {
                    verifyBtn.classList.remove('bg-surface-variant', 'text-outline', 'cursor-not-allowed');
                    verifyBtn.classList.add('bg-primary-container', 'text-on-primary', 'shadow-[0px_4px_12px_rgba(9,20,38,0.1)]', 'hover:opacity-90');
                    verifyBtn.disabled = false;
                } else {
                    verifyBtn.classList.add('bg-surface-variant', 'text-outline', 'cursor-not-allowed');
                    verifyBtn.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-[0px_4px_12px_rgba(9,20,38,0.1)]', 'hover:opacity-90');
                    verifyBtn.disabled = true;
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
