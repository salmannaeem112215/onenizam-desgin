<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Sign In - ONE NIZAM</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#9defe3",
                        "on-primary-container": "#7a849b",
                        "on-background": "#191c1e",
                        "primary-fixed": "#d8e2fc",
                        "surface-container": "#eceef0",
                        "surface": "#f8f9fb",
                        "on-secondary-fixed": "#00201d",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-container": "#9d7e62",
                        "text-muted": "#45474C",
                        "secondary-fixed": "#a0f1e6",
                        "tertiary-fixed-dim": "#e5c0a1",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "inverse-primary": "#bcc7df",
                        "surface-tint": "#545f74",
                        "on-primary-fixed": "#111c2e",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "outline-variant": "#c5c6cd",
                        "secondary-fixed-dim": "#84d5ca",
                        "on-tertiary-fixed": "#2a1704",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e0e3e5",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "on-surface-variant": "#45474c",
                        "on-surface": "#191c1e",
                        "primary-container": "#111c2e",
                        "on-secondary-container": "#0d6f66",
                        "outline-subtle": "#C5C6CD",
                        "outline": "#75777d",
                        "tertiary-fixed": "#ffdcc0",
                        "surface-container-high": "#e6e8ea",
                        "primary": "#000000",
                        "on-tertiary-fixed-variant": "#5b422a",
                        "secondary": "#016a61",
                        "primary-fixed-dim": "#bcc7df",
                        "surface-container-low": "#f2f4f6",
                        "on-secondary-fixed-variant": "#005049",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#2a1704",
                        "pure-white": "#FFFFFF",
                        "tertiary": "#000000",
                        "on-primary-fixed-variant": "#3d475b",
                        "background": "#f8f9fb",
                        "error-container": "#ffdad6",
                        "surface-dim": "#d8dadc",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#f8f9fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "otp-width": "52px",
                        "section-margin": "48px",
                        "auth-column-width": "400px",
                        "stack-gap": "24px",
                        "input-height": "56px"
                    },
                    "fontFamily": {
                        "body-base": ["Inter"],
                        "button-text": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-base": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "button-text": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .input-pill {
            @apply h-input-height rounded-full bg-surface-container-low border-none outline-none px-6 text-on-surface w-full transition-all duration-200 font-body-base text-body-base;
        }
        .input-pill:focus {
            @apply ring-1 ring-outline-variant bg-pure-white;
        }
        .btn-primary {
            @apply h-input-height rounded-full bg-primary-container text-on-primary font-button-text text-button-text w-full flex items-center justify-center transition-all duration-200 shadow-[0px_4px_12px_rgba(9,20,38,0.1)];
        }
        .btn-primary:hover {
            @apply opacity-90;
        }
        .btn-primary:active {
            @apply scale-[0.98];
        }
    </style>
<link rel="stylesheet" href="/shared-auth.css">
</head>
<body class="auth-page bg-pure-white text-on-surface selection:bg-primary-container selection:text-pure-white">
<!-- TopAppBar (Transactional - Nav hidden, brand logo centered) -->
<header class="w-full h-24 bg-transparent flex items-center px-6 pt-10 max-w-7xl mx-auto justify-center md:justify-start">
</header>
<!-- Main Content Canvas -->
<main class="auth-screen">
<div class="auth-card flex flex-col">
<!-- Header Section -->
<div class="mb-section-margin text-center md:text-left">
<h1 class="auth-title">Welcome back</h1>
<p class="auth-subtitle">Sign in to continue managing your business.</p>
</div>
<!-- Form Section -->
<form class="flex flex-col w-full" onsubmit="event.preventDefault(); window.location.href='/front-desk';"><!-- Line-based Container -->
<div class="flex flex-col">
<!-- Email Row -->
<div class="mb-4"><input class="auth-input w-full h-[56px] rounded-full bg-surface-container-low border-none px-6 text-on-surface font-body-base text-[16px] focus:outline-none focus:ring-1 focus:ring-outline-variant transition-all" id="email" placeholder="Email Address" required="" type="email"></div>
<!-- Password Row -->
<div class="relative mb-4"><input class="auth-input w-full h-[56px] rounded-full bg-surface-container-low border-none px-6 pr-12 text-on-surface font-body-base text-[16px] focus:outline-none focus:ring-1 focus:ring-outline-variant transition-all" id="password" placeholder="Password" required="" type="password"><button class="absolute right-6 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" onclick="togglePassword()" type="button"><span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility</span></button></div>
<!-- Remember/Forgot Row -->
<div class="auth-meta flex items-center justify-between min-h-[56px]">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer sr-only" type="checkbox">
<div class="w-5 h-5 rounded-[4px] bg-surface-container-low border border-outline-variant peer-checked:bg-primary-container peer-checked:border-primary-container transition-all"></div>
<span class="material-symbols-outlined text-[16px] text-pure-white absolute opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none">check</span>
</div>
<span class="group-hover:text-on-surface transition-colors select-none">Remember me</span>
</label>
<a class="auth-link" href="/forgot-password">Forgot password?</a>
</div>
</div>
<!-- Actions -->
<div class="mt-6 flex flex-col gap-6">
<button class="auth-primary-button" type="submit">
        Continue
    </button>
<div class="auth-divider" aria-hidden="true"><span>or</span></div>
<!-- Prototype navigation; connect to Google OAuth when authentication is implemented. -->
<button class="auth-google-button" type="button" onclick="window.location.href='/front-desk';">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
<path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.89-1.74 2.98-4.31 2.98-7.36Z"/>
<path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.41l-3.24-2.51c-.9.6-2.05.97-3.38.97-2.61 0-4.83-1.76-5.62-4.12H3.04v2.59A10 10 0 0 0 12 22Z"/>
<path fill="#FBBC05" d="M6.38 13.93a6 6 0 0 1 0-3.86V7.48H3.04a10 10 0 0 0 0 9.04l3.34-2.59Z"/>
<path fill="#EA4335" d="M12 5.95c1.47 0 2.79.51 3.82 1.51l2.87-2.87A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.96 5.48l3.34 2.59C7.17 7.71 9.39 5.95 12 5.95Z"/>
</svg>
<span>Continue with Google</span>
</button>
<p class="auth-meta text-center">
        Don't have an account? 
<a class="auth-link" href="/create-account">Create Account</a>
</p>
</div></form>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-section-margin bg-transparent flex flex-col items-center justify-center gap-4 max-w-[400px] mx-auto text-center px-6">
</footer>
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('visibility-icon');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            } else {
                pwdInput.type = 'password';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            }
        }
    </script>


</body></html>
