<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Sign In - ONE NIZAM</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#9defe3",
                        "on-primary-container": "#7a849b",
                        "on-background": "#191c1e",
                        "primary-fixed": "#d8e2fc",
                        "surface-container": "#eceef0",
                        "surface": "#f8f9fb",
                        "on-secondary-fixed": "#00201d",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-container": "#9d7e62",
                        "text-muted": "#45474C",
                        "secondary-fixed": "#a0f1e6",
                        "tertiary-fixed-dim": "#e5c0a1",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "inverse-primary": "#bcc7df",
                        "surface-tint": "#545f74",
                        "on-primary-fixed": "#111c2e",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "outline-variant": "#c5c6cd",
                        "secondary-fixed-dim": "#84d5ca",
                        "on-tertiary-fixed": "#2a1704",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e0e3e5",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "on-surface-variant": "#45474c",
                        "on-surface": "#191c1e",
                        "primary-container": "#111c2e",
                        "on-secondary-container": "#0d6f66",
                        "outline-subtle": "#C5C6CD",
                        "outline": "#75777d",
                        "tertiary-fixed": "#ffdcc0",
                        "surface-container-high": "#e6e8ea",
                        "primary": "#000000",
                        "on-tertiary-fixed-variant": "#5b422a",
                        "secondary": "#016a61",
                        "primary-fixed-dim": "#bcc7df",
                        "surface-container-low": "#f2f4f6",
                        "on-secondary-fixed-variant": "#005049",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#2a1704",
                        "pure-white": "#FFFFFF",
                        "tertiary": "#000000",
                        "on-primary-fixed-variant": "#3d475b",
                        "background": "#f8f9fb",
                        "error-container": "#ffdad6",
                        "surface-dim": "#d8dadc",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#f8f9fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "otp-width": "52px",
                        "section-margin": "48px",
                        "auth-column-width": "400px",
                        "stack-gap": "24px",
                        "input-height": "56px"
                    },
                    "fontFamily": {
                        "body-base": ["Inter"],
                        "button-text": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-base": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "button-text": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .input-pill {
            @apply h-input-height rounded-full bg-surface-container-low border-none outline-none px-6 text-on-surface w-full transition-all duration-200 font-body-base text-body-base;
        }
        .input-pill:focus {
            @apply ring-1 ring-outline-variant bg-pure-white;
        }
        .btn-primary {
            @apply h-input-height rounded-full bg-primary-container text-on-primary font-button-text text-button-text w-full flex items-center justify-center transition-all duration-200 shadow-[0px_4px_12px_rgba(9,20,38,0.1)];
        }
        .btn-primary:hover {
            @apply opacity-90;
        }
        .btn-primary:active {
            @apply scale-[0.98];
        }
    </style>
</head>
<body class="bg-pure-white min-h-screen flex flex-col items-center justify-between text-on-surface selection:bg-primary-container selection:text-pure-white">
<!-- TopAppBar (Transactional - Nav hidden, brand logo centered) -->
<header class="w-full h-24 bg-transparent flex items-center px-6 pt-10 max-w-7xl mx-auto justify-center md:justify-start">
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full flex flex-col items-center justify-center px-6 py-12">
<div class="w-full max-w-[400px] flex flex-col border border-outline-variant rounded-lg bg-pure-white p-10">
<!-- Header Section -->
<div class="mb-section-margin text-center md:text-left">
<h1 class="font-headline-lg text-[24px] font-bold text-on-surface text-center mb-2">Welcome back</h1>
<p class="font-body-base text-body-base text-on-surface-variant text-center">Sign in to continue managing your business.</p>
</div>
<!-- Form Section -->
<form class="flex flex-col w-full" onsubmit="event.preventDefault(); window.location.href='/front-desk';"><!-- Line-based Container -->
<div class="flex flex-col">
<!-- Email Row -->
<div class="mb-4"><input class="w-full h-[56px] rounded-full bg-surface-container-low border-none px-6 text-on-surface font-body-base text-[16px] focus:outline-none focus:ring-1 focus:ring-outline-variant transition-all" id="email" placeholder="Email Address" required="" type="email"></div>
<!-- Password Row -->
<div class="relative mb-4"><input class="w-full h-[56px] rounded-full bg-surface-container-low border-none px-6 pr-12 text-on-surface font-body-base text-[16px] focus:outline-none focus:ring-1 focus:ring-outline-variant transition-all" id="password" placeholder="Password" required="" type="password"><button class="absolute right-6 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" onclick="togglePassword()" type="button"><span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility</span></button></div>
<!-- Remember/Forgot Row -->
<div class="flex items-center justify-between h-[56px]">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer sr-only" type="checkbox">
<div class="w-5 h-5 rounded-[4px] bg-surface-container-low border border-outline-variant peer-checked:bg-primary-container peer-checked:border-primary-container transition-all"></div>
<span class="material-symbols-outlined text-[16px] text-pure-white absolute opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors select-none">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:opacity-80 transition-opacity" href="#">Forgot password?</a>
</div>
</div>
<!-- Actions -->
<div class="mt-6 flex flex-col gap-6">
<button class="w-full h-[56px] bg-primary text-pure-white border-none rounded-full flex items-center justify-center font-bold text-[18px] mt-6 shadow-[0px_4px_12px_rgba(9,20,38,0.1)] hover:opacity-80 active:scale-[0.98] transition-all" type="submit">
        Continue
    </button>
<p class="text-center font-body-base text-body-base text-on-surface-variant">
        Don't have an account? 
        <a class="font-label-md text-label-md text-primary hover:opacity-80 transition-opacity underline decoration-primary/30 underline-offset-4 hover:decoration-primary" href="#">Create Account</a>
</p>
</div></form>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-section-margin bg-transparent flex flex-col items-center justify-center gap-4 max-w-[400px] mx-auto text-center px-6">
</footer>
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('visibility-icon');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            } else {
                pwdInput.type = 'password';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            }
        }
    </script>


</body></html>
