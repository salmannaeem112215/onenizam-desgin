<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password - ONE NIZAM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared-auth.css">
<script src="/auth-flow.js" defer></script>
</head><body class="auth-page"><main class="auth-screen">
<section class="auth-card auth-stack">
<div><h1 class="auth-title">Forgot password?</h1><p class="auth-subtitle">Enter your email address and we'll send you a code to reset your password.</p></div>
<form id="forgot-form" class="auth-stack">
<label class="auth-sr-only" for="email">Email address</label><input class="auth-input auth-field" id="email" name="email" type="email" placeholder="Email address" autocomplete="email" required><button class="auth-primary-button" type="submit">Send verification code</button>
<a class="auth-secondary-button" href="/login">Back to Sign In</a>
</form></section>
</main></body></html>
