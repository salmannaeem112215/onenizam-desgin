<!DOCTYPE html><html class="light" lang="en" style="width: 1280px; height: 724px; overflow: hidden; position: relative;"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Checkout Workspace</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#ffffff",
                        "brand-gray": "#6E6E73",
                        "brand-border": "#E8EAED",
                        "brand-navy": "#091426",
                        "primary": "#030304",
                        "on-primary": "#ffffff",
                        "surface-container": "#edeef0",
                        "surface-container-low": "#f2f4f6",
                        "on-surface-variant": "#46464a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem", /* 16px matching style guidance */
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "xl": "32px",
                        "xs": "4px",
                        "xxl": "48px",
                        "md": "16px",
                        "unit": "4px",
                        "gutter": "24px",
                        "margin-mobile": "16px",
                        "margin-desktop": "40px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-primary font-body-md antialiased min-h-screen pt-[56px] md:pt-[80px]">
<!-- Navbar Suppression (Transactional Intent - Checkout) -->
<!-- As per instructions, navigation shell is suppressed for linear/transactional flows like Checkout -->
<main class="max-w-7xl mx-auto px-margin-mobile md:px-margin-desktop py-lg grid grid-cols-1 md:grid-cols-12 gap-lg md:gap-xl">
<!-- Left Side (Order Summary) - 65% -->
<section class="md:col-span-8 flex flex-col gap-lg">
<header>
<h2 class="font-headline-sm text-headline-sm uppercase tracking-widest text-brand-gray text-[12px] mb-sm">Checkout / Order Summary</h2>
</header>
<div class="flex flex-col">
<!-- List Item -->
<div class="py-md border-b border-brand-border flex justify-between items-start">
<div>
<h3 class="font-headline-sm text-headline-sm text-primary mb-xs">Hair Extensions</h3>
<p class="font-body-md text-body-md text-brand-gray mb-xs">Long Hair · 2h · Lisa Pearson</p>
<p class="font-label-sm text-label-sm text-brand-gray border border-brand-border inline-block px-2 py-1 rounded">Special discount · PKR 5,000 off</p>
<div class="mt-sm flex gap-md text-brand-gray font-label-md text-label-md">
<button class="hover:text-primary transition-colors">Edit item</button>
<button class="hover:text-primary transition-colors">Remove</button>
</div>
</div>
<div class="text-right">
<span class="font-headline-sm text-headline-sm text-primary">PKR 15,000</span>
</div>
</div>
<!-- Add Item Action -->
<div class="py-md flex">
<button class="flex items-center gap-2 text-brand-gray hover:text-primary transition-colors font-label-md text-label-md">
<span class="material-symbols-outlined text-[20px]">add</span>
                        Add Item
                    </button>
</div>
</div>
<!-- Totals Section -->
<div class="mt-auto pt-lg border-t border-brand-border flex flex-col gap-sm">
<div class="flex justify-between items-center text-brand-gray font-body-md text-body-md">
<span>Subtotal</span>
<span>PKR 20,000</span>
</div>
<div class="flex justify-between items-center text-brand-gray font-body-md text-body-md">
<span>Discount</span>
<span>-PKR 5,000</span>
</div>
<div class="flex justify-between items-center text-primary font-headline-sm text-headline-sm mt-sm pt-sm border-t border-brand-border">
<span>Total</span>
<span>PKR 15,000</span>
</div>
<div class="mt-xl">


</div>
</div>
</section>
<!-- Right Side (Payment) - 35% -->
<aside class="md:col-span-4">
<div class="bg-surface rounded-2xl border border-brand-border p-lg flex flex-col gap-lg h-full">
<!-- Customer Row -->
<div class="flex items-center justify-between pb-md border-b border-brand-border">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant font-headline-sm">
                            L
                        </div>
<div>
<p class="font-headline-sm text-headline-sm text-primary">Laura</p>
<span class="font-label-sm text-label-sm text-brand-gray">New Client</span>
</div>
</div>
<button class="text-brand-gray hover:text-primary">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</div>
<!-- Payment Header & Input -->
<div class="flex flex-col gap-sm">
<h3 class="font-headline-sm text-headline-sm text-primary uppercase tracking-widest text-[12px] text-brand-gray">Payment</h3>
<div class="relative">
<input class="w-full bg-surface border border-brand-border rounded-lg py-md px-lg pl-[60px] font-headline-lg text-headline-lg text-primary focus:outline-none focus:border-brand-navy focus:ring-1 focus:ring-brand-navy transition-all" type="text" value="15,000.00">
<span class="absolute left-md top-1/2 -translate-y-1/2 font-headline-sm text-headline-sm text-brand-gray">PKR</span>
</div>
</div>
<!-- Payment Methods Grid -->
<div class="grid grid-cols-2 gap-sm">
<!-- Methods list from prompt -->
<button class="bg-surface border border-brand-border rounded-lg py-sm px-md flex items-center gap-2 hover:bg-surface-container-low transition-colors font-label-md text-label-md text-primary">
<span class="material-symbols-outlined text-[20px] text-brand-gray">link</span>
                        Pay By Link
                    </button>
<button class="bg-surface border border-brand-border rounded-lg py-sm px-md flex items-center gap-2 hover:bg-surface-container-low transition-colors font-label-md text-label-md text-primary">
<span class="material-symbols-outlined text-[20px] text-brand-gray">credit_card</span>
                        Mada
                    </button>
<button class="bg-surface border border-brand-border rounded-lg py-sm px-md flex items-center gap-2 hover:bg-surface-container-low transition-colors font-label-md text-label-md text-primary">
<span class="material-symbols-outlined text-[20px] text-brand-gray">receipt</span>
                        Check
                    </button>
<button class="bg-surface border border-brand-border rounded-lg py-sm px-md flex items-center gap-2 hover:bg-surface-container-low transition-colors font-label-md text-label-md text-primary">
<span class="material-symbols-outlined text-[20px] text-brand-gray">room_service</span>
                        Room Charge
                    </button>
<button class="bg-surface border border-brand-border rounded-lg py-sm px-md flex items-center gap-2 hover:bg-surface-container-low transition-colors font-label-md text-label-md text-primary">
<span class="material-symbols-outlined text-[20px] text-brand-gray">sell</span>
                        Groupon
                    </button>
<!-- Selected State -->
<button class="bg-surface border-2 border-brand-navy rounded-lg py-sm px-md flex items-center gap-2 font-label-md text-label-md text-primary relative overflow-hidden">
<span class="material-symbols-outlined text-[20px] text-brand-navy">credit_card</span>
                        Card
                        <span class="material-symbols-outlined text-[16px] text-brand-navy ml-auto" style="font-variation-settings: &quot;FILL&quot; 1;">check_circle</span>
</button>
<button class="bg-surface border border-brand-border rounded-lg py-sm px-md flex items-center gap-2 hover:bg-surface-container-low transition-colors font-label-md text-label-md text-primary">
<span class="material-symbols-outlined text-[20px] text-brand-gray">payments</span>
                        Cash
                    </button>
<button class="bg-surface border border-brand-border rounded-lg py-sm px-md flex items-center gap-2 hover:bg-surface-container-low transition-colors font-label-md text-label-md text-primary">
<span class="material-symbols-outlined text-[20px] text-brand-gray">redeem</span>
                        Voucher
                    </button>
</div>
<!-- Action Area -->
<div class="mt-auto pt-lg flex flex-col gap-md text-center">
<button class="w-full bg-brand-navy text-on-primary rounded-full py-md font-headline-sm text-headline-sm hover:opacity-90 transition-opacity flex justify-center items-center gap-2">
                        Charge PKR 15,000 <span class="opacity-50">·</span> Card
                    </button>
<button class="font-label-md text-label-md text-brand-gray hover:text-primary transition-colors">
                        More options
                    </button>
</div>
</div>
</aside>
</main>


<div id="snapdom-sandbox" data-snapdom-sandbox="true" aria-hidden="true" style="position: absolute; left: -9999px; top: -9999px; width: 0px; height: 0px; overflow: hidden;"></div></body></html>
