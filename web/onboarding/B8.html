<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Create Account | ONE NIZAM</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#9defe3",
                        "on-primary-container": "#7a849b",
                        "on-background": "#191c1e",
                        "primary-fixed": "#d8e2fc",
                        "surface-container": "#eceef0",
                        "surface": "#f8f9fb",
                        "on-secondary-fixed": "#00201d",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-container": "#9d7e62",
                        "text-muted": "#45474C",
                        "secondary-fixed": "#a0f1e6",
                        "tertiary-fixed-dim": "#e5c0a1",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "inverse-primary": "#bcc7df",
                        "surface-tint": "#545f74",
                        "on-primary-fixed": "#111c2e",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "outline-variant": "#c5c6cd",
                        "secondary-fixed-dim": "#84d5ca",
                        "on-tertiary-fixed": "#2a1704",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e0e3e5",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "on-surface-variant": "#45474c",
                        "on-surface": "#191c1e",
                        "primary-container": "#111c2e",
                        "on-secondary-container": "#0d6f66",
                        "outline-subtle": "#C5C6CD",
                        "outline": "#75777d",
                        "tertiary-fixed": "#ffdcc0",
                        "surface-container-high": "#e6e8ea",
                        "primary": "#000000",
                        "on-tertiary-fixed-variant": "#5b422a",
                        "secondary": "#016a61",
                        "primary-fixed-dim": "#bcc7df",
                        "surface-container-low": "#f2f4f6",
                        "on-secondary-fixed-variant": "#005049",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#2a1704",
                        "pure-white": "#FFFFFF",
                        "tertiary": "#000000",
                        "on-primary-fixed-variant": "#3d475b",
                        "background": "#f8f9fb",
                        "error-container": "#ffdad6",
                        "surface-dim": "#d8dadc",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#f8f9fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "otp-width": "52px",
                        "section-margin": "48px",
                        "auth-column-width": "400px",
                        "stack-gap": "24px",
                        "input-height": "56px"
                    },
                    "fontFamily": {
                        "body-base": ["Inter"],
                        "button-text": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-base": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "button-text": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Form Autofill fixes for pure pure-white background */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #F2F4F6 inset !important;
            -webkit-text-fill-color: #191c1e !important;
            transition: background-color 5000s ease-in-out 0s;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .req-active {
            color: #016a61; /* secondary color from config */
            transition: color 0.3s ease;
        }
        .req-active .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
        .req-inactive {
            color: #75777d; /* outline color from config */
            transition: color 0.3s ease;
        }
    </style>
</head>
<body class="bg-pure-white text-on-surface antialiased min-h-screen flex flex-col items-center">
<!-- TopAppBar (Transactional context -> hidden nav, brand only) -->
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-[400px] flex flex-col justify-center px-[24px] md:px-0 py-section-margin">
<form class="flex flex-col w-full" id="signupForm"><div class="border border-[#E5E7EB] rounded-[12px] bg-pure-white p-6 flex flex-col gap-4">
<div class="text-center mb-2">
<h2 class="font-headline-lg-mobile text-[28px] font-[700] text-on-surface mb-1">Create your account</h2>
<p class="font-body-base text-[16px] text-text-muted">Create an account to start managing your business with One Nizam.</p>
</div>
<div class="flex gap-3">
<div class="flex-1">
<label class="sr-only" for="firstName">First Name</label>
<input class="w-full bg-surface-container-low border-0 focus:ring-1 focus:ring-outline-variant p-0 font-body-base text-on-surface placeholder:text-outline h-input-height px-6 rounded-full" id="firstName" name="firstName" placeholder="First Name" required="" type="text">
</div>
<div class="flex-1">
<label class="sr-only" for="lastName">Last Name</label>
<input class="w-full bg-surface-container-low border-0 focus:ring-1 focus:ring-outline-variant p-0 font-body-base text-on-surface placeholder:text-outline h-input-height px-6 rounded-full" id="lastName" name="lastName" placeholder="Last Name" required="" type="text">
</div>
</div>
<div>
<label class="sr-only" for="email">Email Address</label>
<input class="w-full bg-surface-container-low border-0 focus:ring-1 focus:ring-outline-variant p-0 font-body-base text-on-surface placeholder:text-outline h-input-height px-6 rounded-full" id="email" name="email" placeholder="Email Address" required="" type="email">
</div>
<div class="flex flex-col gap-2">
<div class="relative">
<label class="sr-only" for="password">Password</label>
<input class="w-full bg-surface-container-low border-0 focus:ring-1 focus:ring-outline-variant p-0 pr-12 font-body-base text-on-surface placeholder:text-outline h-input-height px-6 rounded-full" id="password" name="password" placeholder="Password" required="" type="password">
<button class="absolute right-0 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none px-4" id="togglePassword" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<div class="flex flex-col gap-1 px-2">
<div class="flex items-center gap-2 req-inactive font-body-base text-[14px]" id="req-length">
<span class="material-symbols-outlined text-[16px]" data-icon="check_circle">check_circle</span>
<span>Min. 8 characters</span>
</div>
<div class="flex items-center gap-2 req-inactive font-body-base text-[14px]" id="req-complex">
<span class="material-symbols-outlined text-[16px]" data-icon="check_circle">check_circle</span>
<span>Uppercase, number &amp; symbol</span>
</div>
</div>
</div>
<div>
<label class="sr-only" for="confirmPassword">Confirm Password</label>
<input class="w-full bg-surface-container-low border-0 focus:ring-1 focus:ring-outline-variant p-0 font-body-base text-on-surface placeholder:text-outline h-input-height px-6 rounded-full" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required="" type="password">
</div>
<div class="mt-2">
<button class="w-full h-input-height bg-primary text-pure-white rounded-full font-button-text text-button-text hover:bg-surface-tint transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex items-center justify-center gap-2" type="submit">
      Create Account
    </button>
<div class="mt-6 text-center">
<p class="font-body-base text-body-base text-text-muted">
        Already have an account? <a class="font-label-md text-label-md text-on-surface hover:text-surface-tint transition-colors" href="#">Sign In</a>
</p>
</div>
</div>
</div></form>
</main>
<!-- Footer -->
<footer class="w-full py-section-margin bg-transparent flat no shadows flex flex-col items-center justify-center gap-4 w-full max-w-[auth-column-width] mx-auto text-center mt-auto pb-12">
<div class="flex flex-wrap justify-center gap-6">
</div>
</footer>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const reqLength = document.getElementById('req-length');
            const reqComplex = document.getElementById('req-complex');

            // Toggle password visibility
            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                const icon = togglePasswordBtn.querySelector('span');
                icon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
                icon.setAttribute('data-icon', type === 'password' ? 'visibility' : 'visibility_off');
            });

            // Password validation logic
            passwordInput.addEventListener('input', (e) => {
                const val = e.target.value;
                
                // Length check
                if (val.length >= 8) {
                    reqLength.classList.remove('req-inactive');
                    reqLength.classList.add('req-active');
                } else {
                    reqLength.classList.remove('req-active');
                    reqLength.classList.add('req-inactive');
                }

                // Complexity check: Uppercase, number, symbol
                const hasUpper = /[A-Z]/.test(val);
                const hasNumber = /[0-9]/.test(val);
                const hasSymbol = /[!@#$%^&*(),.?":{}|<>]/.test(val);

                if (hasUpper && hasNumber && hasSymbol) {
                    reqComplex.classList.remove('req-inactive');
                    reqComplex.classList.add('req-active');
                } else {
                    reqComplex.classList.remove('req-active');
                    reqComplex.classList.add('req-inactive');
                }
            });

            // Form submission visual feedback (prevent default for demo)
            document.getElementById('signupForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button[type="submit"]');
                const originalText = btn.textContent;
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    // Ideally redirect here
                }, 1500);
            });
        });
    </script>
</body></html>
