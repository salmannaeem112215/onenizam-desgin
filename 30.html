<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account - ONE NIZAM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared-auth.css">
<script src="/auth-flow.js" defer></script>
</head><body class="auth-page"><main class="auth-screen">
<section class="auth-card auth-stack">
<div><h1 class="auth-title">Create your account</h1><p class="auth-subtitle">Create an account to start managing your business with One Nizam.</p></div>
<form id="signup-form" class="auth-stack auth-form-stack">
<div class="auth-name-row"><div><label class="auth-sr-only" for="first-name">First name</label><input class="auth-input auth-field" id="first-name" name="first-name" type="text" placeholder="First name" autocomplete="given-name" required></div><div><label class="auth-sr-only" for="last-name">Last name</label><input class="auth-input auth-field" id="last-name" name="last-name" type="text" placeholder="Last name" autocomplete="family-name" required></div></div>
<label class="auth-sr-only" for="email">Email address</label><input class="auth-input auth-field" id="email" name="email" type="email" placeholder="Email address" autocomplete="email" required><div class="auth-password"><label class="auth-sr-only" for="signup-password">Password</label><input class="auth-input auth-field" id="signup-password" name="signup-password" type="password" placeholder="Password" autocomplete="new-password" required><button class="auth-toggle" type="button" data-toggle="signup-password" aria-label="Show password" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><p class="auth-checklist auth-help">Use at least 8 characters, including uppercase and lowercase letters, a number, and a symbol.</p>
<div class="auth-password"><label class="auth-sr-only" for="signup-confirm">Confirm password</label><input class="auth-input auth-field" id="signup-confirm" name="signup-confirm" type="password" placeholder="Confirm password" autocomplete="new-password" required><button class="auth-toggle" type="button" data-toggle="signup-confirm" aria-label="Show confirm password" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button class="auth-primary-button" type="submit">Create Account</button>
</form>
<div class="auth-divider" aria-hidden="true"><span>or</span></div>
<button class="auth-google-button" type="button" onclick="window.location.href='/front-desk';">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
<path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.89-1.74 2.98-4.31 2.98-7.36Z"/>
<path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.41l-3.24-2.51c-.9.6-2.05.97-3.38.97-2.61 0-4.83-1.76-5.62-4.12H3.04v2.59A10 10 0 0 0 12 22Z"/>
<path fill="#FBBC05" d="M6.38 13.93a6 6 0 0 1 0-3.86V7.48H3.04a10 10 0 0 0 0 9.04l3.34-2.59Z"/>
<path fill="#EA4335" d="M12 5.95c1.47 0 2.79.51 3.82 1.51l2.87-2.87A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.96 5.48l3.34 2.59C7.17 7.71 9.39 5.95 12 5.95Z"/>
</svg>
<span>Continue with Google</span>
</button><p class="auth-meta auth-center">Already have an account? <a class="auth-link" href="/login">Sign In</a></p>
</section>
</main></body></html>
